name: Deploy to Lightsail

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Java 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. application.properties 생성
      - name: Create application.properties
        run: |
          mkdir -p java/src/main/resources
          cat > java/src/main/resources/application.properties << EOF
          spring.application.name=demo

          spring.datasource.url=${{ secrets.DB_URL }}
          spring.datasource.username=docutag_user
          spring.datasource.password=${{ secrets.DB_PASSWORD }}
          spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

          spring.jpa.hibernate.ddl-auto=update
          spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
          spring.jpa.properties.hibernate.format_sql=true

          logging.level.org.hibernate.SQL=DEBUG
          logging.level.org.hibernate.orm.jdbc.bind=TRACE

          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

          kakao.client-id=${{ secrets.KAKAO_CLIENT_ID }}
          kakao.client-secret=${{ secrets.KAKAO_CLIENT_SECRET }}
          kakao.redirect-uri=http://localhost:8080/auth/kakao/callback

          jwt.secret=${{ secrets.JWT_SECRET }}
          EOF

      # 4. 빌드
      - name: Grant execute permission for gradlew
        run: chmod +x java/gradlew

      - name: Build with Gradle
        run: cd java && ./gradlew build -x test

      # 5. SSH 키 세팅 (이후 스텝 전체에서 재사용)
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/lightsail.pem
          chmod 600 ~/.ssh/lightsail.pem
          ssh-keyscan -H ${{ secrets.LIGHTSAIL_HOST }} >> ~/.ssh/known_hosts

      # 6. 기존 프로세스 종료 + 디렉토리 생성
      - name: Prepare server
        run: |
          ssh -i ~/.ssh/lightsail.pem \
              -o ServerAliveInterval=15 \
              -o ConnectTimeout=30 \
              ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} << 'EOF'
            PID=$(pgrep -f 'demo-0.0.1-SNAPSHOT.jar') && kill $PID || true
            sleep 2
            mkdir -p ~/app
          EOF

      # 7. JAR 파일 전송
      - name: Copy JAR to Lightsail
        run: |
          scp -i ~/.ssh/lightsail.pem \
              -o ServerAliveInterval=15 \
              -o ConnectTimeout=30 \
              java/build/libs/demo-0.0.1-SNAPSHOT.jar \
              ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}:~/app/

      # 8. JAR 실행
      - name: Run JAR on Lightsail
        run: |
          ssh -i ~/.ssh/lightsail.pem \
              -o ServerAliveInterval=15 \
              -o ConnectTimeout=30 \
              ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} << 'EOF'
            cd ~/app
            nohup java -jar demo-0.0.1-SNAPSHOT.jar > ~/app/app.log 2>&1 &
            disown
            echo "배포 완료"
          EOF

      # 9. React 빌드 (Java 빌드 이후에 추가)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build React
        env:
          CI: false
        run: |
          cd react/docu_tag  # 폴더명 맞게 수정
          npm install
          chmod +x node_modules/.bin/react-scripts
          npm run build

      # 10. React 빌드 파일 전송
      - name: Copy React build to Lightsail
        run: |
          ssh -i ~/.ssh/lightsail.pem \
              ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} \
              "mkdir -p ~/app/frontend"
          
          scp -i ~/.ssh/lightsail.pem -r \
              react/docu_tag/build/ \
              ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}:~/app/frontend/

      # 11. react 리로드
      - name: Reload nginx
        run: |
          ssh -i ~/.ssh/lightsail.pem \
              ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} \
              "sudo systemctl reload nginx"

      # 12. SSH 키 정리
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/lightsail.pem