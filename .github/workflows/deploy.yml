name: Deploy to Lightsail

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Java 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. application.properties 생성
      - name: Create application.properties
        run: |
          mkdir -p src/main/resources
          cat > src/main/resources/application.properties << EOF
          spring.application.name=demo
          
          spring.datasource.url=${{ secrets.DB_URL }}
          spring.datasource.username=docutag_user
          spring.datasource.password=${{ secrets.DB_PASSWORD }}
          spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
          
          spring.jpa.hibernate.ddl-auto=update
          spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
          spring.jpa.properties.hibernate.format_sql=true
          
          logging.level.org.hibernate.SQL=DEBUG
          logging.level.org.hibernate.orm.jdbc.bind=TRACE
          
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          
          kakao.client-id=${{ secrets.KAKAO_CLIENT_ID }}
          kakao.client-secret=${{ secrets.KAKAO_CLIENT_SECRET }}
          kakao.redirect-uri=http://localhost:8080/auth/kakao/callback
          
          jwt.secret=${{ secrets.JWT_SECRET }}
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x java/gradlew     # 실제 경로로 변경

      - name: Build with Gradle
        run: cd java && ./gradlew build -x test   # cd 후 실행

      # 5. 기존 프로세스 종료 + 디렉토리 생성
      - name: Prepare server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            pkill -f 'demo-0.0.1-SNAPSHOT.jar' || true
            mkdir -p ~/app

      # 6. JAR 파일 전송  ← SCP 액션 사용
      - name: Copy JAR to Lightsail
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: "java/build/libs/demo-0.0.1-SNAPSHOT.jar"
          target: "~/app"

      # 7. JAR 실행
      - name: Run JAR on Lightsail
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            cd ~/app
            nohup java -jar demo-0.0.1-SNAPSHOT.jar > ~/app/app.log 2>&1 &
            echo "배포 완료"